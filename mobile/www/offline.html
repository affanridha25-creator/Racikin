<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#D53E0F">
<title>Racikin</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#fff;display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden;background:linear-gradient(150deg,#F26A2E 0%,#D53E0F 48%,#8F1208 100%)}
.blob{position:fixed;border-radius:50%;pointer-events:none}
.b1{width:70vmax;height:70vmax;left:-24vmax;top:-26vmax;background:radial-gradient(circle,rgba(255,255,255,.26),rgba(255,255,255,0) 70%);animation:d1 12s ease-in-out infinite alternate}
.b2{width:64vmax;height:64vmax;right:-22vmax;bottom:-24vmax;background:radial-gradient(circle,rgba(255,196,120,.34),rgba(255,196,120,0) 70%);animation:d2 14s ease-in-out infinite alternate}
.c{position:relative;z-index:1;max-width:340px}
.disc{width:112px;height:112px;margin:0 auto 22px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 22px 50px rgba(80,10,0,.4),0 0 0 12px rgba(255,255,255,.16);animation:pop .7s cubic-bezier(.3,1.5,.5,1) both,bob 3s .8s ease-in-out infinite}
.disc img{width:74%;height:auto}
h1{font-size:23px;font-weight:800;letter-spacing:-.01em;animation:up .6s .2s both}
p{font-size:14px;line-height:1.55;opacity:.92;margin-top:8px;animation:up .6s .32s both}
.dots{display:flex;gap:7px;justify-content:center;margin:20px 0 22px;animation:up .6s .4s both}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.35;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
button{border:none;background:#fff;color:#D53E0F;font:inherit;font-weight:800;font-size:15px;padding:14px 30px;border-radius:999px;cursor:pointer;box-shadow:0 12px 26px rgba(0,0,0,.22);animation:up .6s .5s both;transition:transform .15s}
button:active{transform:scale(.96)}
.tip{font-size:12px;opacity:.8;margin-top:18px;animation:up .6s .6s both}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.1)}}@keyframes d2{to{transform:translate(-7vmax,-5vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
